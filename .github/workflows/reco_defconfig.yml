name: Build reco_defconfig

on: workflow_dispatch

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Build
      run: |
        rm -f *.zip
        chmod +x -R *
        ./da.sh
    
    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "actions@github.com"
        
    - name: Add and Commit file
      run: |
        git add zImage.zip
        git commit -m "compiled successfully"
        git push
